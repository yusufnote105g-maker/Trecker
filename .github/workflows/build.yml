name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          
      - name: Fix Dependencies and Build
        run: |
          unzip HabitTracker-project-2026-11-11-final-v2.zip
          cd habittracker
          
          # Внедряем недостающую библиотеку в build.gradle.kts
          sed -i '/dependencies/a \    implementation("androidx.compose.runtime:runtime-saveable")' app/build.gradle.kts
          
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-APK
          path: habittracker/app/build/outputs/apk/debug/app-debug.apk
