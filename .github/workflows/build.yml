name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          
      - name: Fix and Build
        run: |
          unzip HabitTracker-project-2026-11-11-final-v2.zip
          cd habittracker
          
          # 1. Исправляем несуществующую версию KSP плагина
          sed -i 's/2.0.21-1.0.28/2.0.21-1.0.25/g' build.gradle.kts
          if [ -f gradle/libs.versions.toml ]; then
            sed -i 's/2.0.21-1.0.28/2.0.21-1.0.25/g' gradle/libs.versions.toml
          fi
          
          # 2. Заменяем проблемную функцию rememberSaveable на обычную remember во всех файлах проекта
          find . -type f -name "*.kt" -exec sed -i 's/rememberSaveable/remember/g' {} +
          
          # 3. Запускаем сборку
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-APK
          path: habittracker/app/build/outputs/apk/debug/app-debug.apk
