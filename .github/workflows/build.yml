name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          
      - name: Unzip, Fix Imports and Build
        run: |
          unzip HabitTracker-project-2026-11-11-final-v2.zip
          cd habittracker
          
          # Автоматически добавляем недостающий импорт в два файла
          sed -i '1i import androidx.compose.runtime.saveable.rememberSaveable' app/src/main/java/com/example/habittracker/ui/screens/taskform/TaskFormScreen.kt
          sed -i '1i import androidx.compose.runtime.saveable.rememberSaveable' app/src/main/java/com/example/habittracker/ui/screens/tasks/TasksScreen.kt
          
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-APK
          path: habittracker/app/build/outputs/apk/debug/app-debug.apk
